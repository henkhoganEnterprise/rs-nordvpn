[package]
name = "nordvpn"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
clap = { version = "4.0", features = ["derive"] } 
env_logger = "0.11.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
log = "0.4.22"
tokio = { version = "1", features = ["full"] }
tokio-util = "*"